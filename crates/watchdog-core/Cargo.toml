[package]
name = "watchdog-core"
version = "0.1.0"
edition = "2021"
description = "应用看门狗共享核心：配置解析、进程拉起、监控循环、日志与 Windows 服务集成"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sysinfo = "0.39"
time = { version = "0.3", features = ["local-offset", "macros", "formatting"] }

[build-dependencies]
# 与运行时依赖共用 time，生成编译时间版本号（见 build.rs）
time = { version = "0.3", features = ["local-offset", "macros", "formatting"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
# 按监听端口查进程 PID（GetExtendedTcpTable）：端口检测程序的精确停止
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
